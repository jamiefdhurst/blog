version: 2
updates:
  # Enable version updates for pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "⬆️ dependencies"
    assignees:
      - "jamiefdhurst"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      # Group the tooling used to test and lint the generator
      tooling:
        patterns:
          - "pytest"
          - "coverage"
          - "pylint"
      # Group the templating and markdown rendering stack
      rendering:
        patterns:
          - "Jinja2"
          - "Markdown"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "⬆️ dependencies"
    assignees:
      - "jamiefdhurst"
    commit-message:
      prefix: "chore"
      include: "scope"
