name: Build

on:
  push:
    branches:
      - 'main'
    paths:
      - '*.py'
      - '*.md'
      - 'articles/**'
      - 'blog/**'
      - 'docker/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'setup.cfg'

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
      - name: Calculate Next Version
        id: version
        run: |
          chmod +x .github/scripts/calculate-version.sh
          .github/scripts/calculate-version.sh
      - name: Update Version in blog/config.py and setup.cfg
        if: steps.version.outputs.should_release == 'true'
        run: |
          echo "Previous version: ${{ steps.version.outputs.previous_version }}"
          echo "New version: v${{ steps.version.outputs.version }}"
          sed -i "s/^VERSION = '.*'/VERSION = 'v${{ steps.version.outputs.version }}'/" blog/config.py
          sed -i "s/^version = .*/version = v${{ steps.version.outputs.version }}/" setup.cfg
          grep -H VERSION blog/config.py
          grep -H version setup.cfg
      - name: File Save Delay
        if: steps.version.outputs.should_release == 'true'
        uses: jakejarvis/wait-action@master
        with:
          time: '2s'
      - name: Generate Changelog
        if: steps.version.outputs.should_release == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag v${{ steps.version.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md
      - name: Commit Version and Changelog Changes
        if: steps.version.outputs.should_release == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip ci] Update version to v${{ steps.version.outputs.version }}"
          file_pattern: "blog/config.py setup.cfg CHANGELOG.md"
      - name: Setup Python
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Dependencies
        if: steps.version.outputs.should_release == 'true'
        run: |
          python -m pip install -r requirements.txt
      - name: Validate Articles
        if: steps.version.outputs.should_release == 'true'
        run: |
          python .github/scripts/validate-articles.py
      - name: Generate Distribution
        if: steps.version.outputs.should_release == 'true'
        run: |
          python -m blog.generate
          cd dist
          zip -r ../blog-v${{ steps.version.outputs.version }}.zip *
      - name: Generate Release Notes
        if: steps.version.outputs.should_release == 'true'
        id: release_notes
        run: |
          chmod +x .github/scripts/release-notes.sh
          .github/scripts/release-notes.sh ${{ steps.version.outputs.version }}
      - name: Create Release
        if: steps.version.outputs.should_release == 'true'
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifacts: blog-v${{ steps.version.outputs.version }}.zip
          bodyFile: 'release_notes.md'
          draft: false
          makeLatest: true
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
