name: Test

on:
  pull_request: {}

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

env:
  FLASK_APP: blog
  FLASK_ENV: development
  GITHUB_USERNAME: jamiefdhurst
  GITHUB_TOKEN: example

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate Commit Messages
        run: |
          chmod +x .githooks/commit-msg

          # Get all commits in the PR
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Get commit hashes into an array
          mapfile -t commit_hashes < <(git log $BASE_SHA..$HEAD_SHA --pretty=format:"%H")

          if [ ${#commit_hashes[@]} -eq 0 ]; then
            echo "✅ No commits to validate"
            exit 0
          fi

          # Track validation results
          invalid_commits=()
          valid_count=0

          # Validate each commit using the same hook used locally
          for hash in "${commit_hashes[@]}"; do
            message=$(git log -1 --pretty=format:"%s" "$hash")

            # Write message to temp file
            echo "$message" > /tmp/commit-msg.txt

            # Validate using the commit-msg hook
            if .githooks/commit-msg /tmp/commit-msg.txt > /dev/null 2>&1; then
              echo "✅ $message"
              valid_count=$((valid_count + 1))
            else
              echo "❌ $message"
              invalid_commits+=("$hash|||$message")
            fi
          done

          rm -f /tmp/commit-msg.txt

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # Report results
          if [ ${#invalid_commits[@]} -eq 0 ]; then
            echo "✅ All $valid_count commit(s) follow the convention"
            exit 0
          else
            echo "❌ Found ${#invalid_commits[@]} invalid commit message(s):"
            echo ""
            for commit in "${invalid_commits[@]}"; do
              hash="${commit%%|||*}"
              msg="${commit#*|||}"
              short_hash=$(echo "$hash" | cut -c1-7)
              echo "  $short_hash: $msg"
            done
            echo ""
            echo "See .github/COMMIT_CONVENTION.md for details on the commit message format"
            exit 1
          fi
      - name: Calculate Version Impact
        id: version
        run: |
          chmod +x .github/scripts/calculate-version.sh
          .github/scripts/calculate-version.sh
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Test
        run: |
          coverage run --branch --omit=tests/\* -m pytest --verbose --junit-xml tests.xml
          coverage xml -o coverage.xml
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests
          path: tests.xml
      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          action_fail: true
          files: |
            tests.xml
      - name: Create Code Coverage Report
        uses: im-open/code-coverage-report-generator@v5.0.1
        with:
          reports: coverage.xml
          reporttypes: MarkdownSummary
          title: Pytest Code Coverage
      - name: Publish Code Coverage
        uses: im-open/process-code-coverage-summary@v2.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-file: './coverage-results/Summary.md'
          check-name: 'Code Coverage'
          # Both thresholds must be non-zero. The action forces the status
          # check to a 'neutral' conclusion if either is left at 0, which
          # stops the line threshold from ever blocking a merge.
          line-threshold: 80
          branch-threshold: 75
      - name: Comment PR with Version Impact
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## 📦 Version Impact

            **Current version:** `${{ steps.version.outputs.previous_version }}`
            **Next version:** `v${{ steps.version.outputs.version }}`
            **Bump type:** `${{ steps.version.outputs.bump_type }}`
            **Will release:** ${{ steps.version.outputs.should_release == 'true' && '✅ Yes' || '⚪️ No (non-releasable changes only)' }}

            ---

            <sub>This PR will ${{ steps.version.outputs.should_release == 'true' && format('trigger a **{0}** version bump from `{1}` to `v{2}`', steps.version.outputs.bump_type, steps.version.outputs.previous_version, steps.version.outputs.version) || 'not trigger a release (only docs/test/chore/build/ci/style/revert changes)' }}</sub>
          comment-tag: version_impact
