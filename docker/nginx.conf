
user    nginx;
worker_processes    auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml+rss;

    server {
        listen       80;
        server_name  localhost;
        root   /usr/share/nginx/html;

        # Static assets are immutable in practice - the CSS is cache busted
        # with ?v= and images are replaced under new names when they change.
        # Set Cache-Control directly rather than via expires, which would
        # emit a second, competing Cache-Control header.
        location /static/ {
            add_header Cache-Control "public, max-age=2592000";
        }

        # Pages are rewritten in place on each release, so they must be
        # revalidated rather than cached.
        location ~ \.html$ {
            add_header Cache-Control "no-cache";
        }

        if ($request_uri ~ \?page=(.*)) {
            rewrite .* /index-$arg_page.html;
        }

        if ($request_uri ~ ^/([\w\-]+)$) {
            rewrite .* $request_uri.html;
        }
    }
}
